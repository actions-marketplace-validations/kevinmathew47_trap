<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" role="img" aria-label="Terminal showing a bot stealing a fake .env file, then being served a fake maze page instead of the real site">
  <rect width="860" height="300" rx="10" fill="#16161a"/>
  <rect width="860" height="34" rx="10" fill="#22222a"/>
  <rect y="24" width="860" height="10" fill="#22222a"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#d7d7dc" xml:space="preserve">
    <text x="24" y="66" fill="#8b8b96"># a bot goes looking for secrets</text>
    <text x="24" y="88"><tspan fill="#7ee787">$</tspan> curl https://your-app.example/.env</text>
    <text x="24" y="110" fill="#f2cc60">DATABASE_URL=postgres://app_admin:itbm…@db.internal:5432/app_production</text>
    <text x="24" y="130" fill="#f2cc60">STRIPE_SECRET_KEY=sk_live_qPmb…        <tspan fill="#8b8b96"># all fake, generated on your server</tspan></text>

    <text x="24" y="168" fill="#8b8b96"># it is now banned: every page it asks for is slow and fake</text>
    <text x="24" y="190"><tspan fill="#7ee787">$</tspan> curl https://your-app.example/products</text>
    <text x="24" y="212" fill="#ff6b6b">&lt;title&gt;contract internal 5573&lt;/title&gt; ... 8 more fake links ...</text>

    <text x="24" y="250" fill="#8b8b96"># and if it ever tries a stolen key, you see it</text>
    <text x="24" y="272"><tspan fill="#d2a8ff">canary</tspan>  203.0.113.9  script  POST /api/charge  <tspan fill="#8b8b96">(bait:STRIPE_SECRET_KEY)</tspan></text>
  </g>
</svg>
